<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menuja e Barit</title>
    <style>
        :root {
            --primary-bg: #121212;
            --text-main: #f5f5f5;
            --accent-color: #d4af37; /* Ngjyrë ari për thekse (lounge style) */
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
            border-bottom: 1px solid #2a2a2a;
        }
        h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-color);
        }
        .categories {
            display: flex;
            overflow-x: auto;
            padding: 1.2rem 1rem;
            gap: 1rem;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .category-btn {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--text-main);
            padding: 0.6rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .category-btn.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }
        .menu-section {
            padding: 1rem;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #333;
            padding: 1.2rem 0;
        }
        .item-details h3 {
            margin: 0 0 0.3rem 0;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
        .item-details p {
            margin: 0;
            font-size: 0.85rem;
            color: #999;
        }
        .item-price {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.15rem;
            padding-left: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Emri i Barit</h1>
        <p style="color: #888; font-size: 0.9rem; margin-top: 0.5rem;">LOUNGE & COCKTAILS</p>
    </header>

    <!-- Navigimi i Menuve -->
    <div class="categories">
        <button class="category-btn active">Të Gjitha</button>
        <button class="category-btn">Kafja</button>
        <button class="category-btn">Koktejle</button>
        <button class="category-btn">Verëra</button>
        <button class="category-btn">Ushqim</button>
    </div>

    <!-- Lista e Artikujve -->
    <div class="menu-section">
        <div class="menu-item">
            <div class="item-details">
                <h3>Aperol Spritz</h3>
                <p>Aperol, Prosecco, Soda, Feta portokalli</p>
            </div>
            <div class="item-price">600 L</div>
        </div>
        
        <div class="menu-item">
            <div class="item-details">
                <h3>Negroni</h3>
                <p>Gin, Campari, Sweet Vermouth</p>
            </div>
            <div class="item-price">700 L</div>
        </div>

        <div class="menu-item">
            <div class="item-details">
                <h3>Espresso</h3>
                <p>100% Arabica Blend</p>
            </div>
            <div class="item-price">100 L</div>
        </div>
    </div>

</body>
</html>
